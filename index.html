<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casamento de Amilton e Odmira – Convite Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',sans-serif;background:#faf7f2;color:#3a2e26;min-height:100vh}
.card-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#f5ede0 0%,#faf7f2 70%)}
.card{background:#fff;max-width:400px;width:100%;padding:52px 40px 44px;position:relative;text-align:center}
.card::before,.card::after{content:'';position:absolute;inset:7px;border:1px solid #d9c4a8;pointer-events:none}
.card::after{inset:12px;border-color:#ecdcca}
.ornament{color:#c4956a;letter-spacing:10px;font-size:13px;margin-bottom:20px;display:block}
.card-welcome{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;color:#7a4f2e;line-height:1;margin-bottom:6px}
.card-sub{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#b8956a;margin-bottom:36px}
.hr{display:flex;align-items:center;gap:10px;margin:22px 0}
.hr::before,.hr::after{content:'';flex:1;height:1px;background:#e8d5c0}
.hr-icon{color:#c4956a;font-size:12px}
.lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#b8956a;margin-bottom:6px}
.val{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:#3a2e26;margin-bottom:22px;line-height:1.3}
.val-big{font-style:normal;font-size:40px;font-weight:600;color:#7a4f2e;margin-bottom:22px;font-family:'Cormorant Garamond',serif}
.status-pill{display:inline-block;padding:7px 24px;border-radius:30px;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.s-confirmado{background:#f0f9f4;color:#166534;border:1px solid #bbf7d0}
.s-pendente{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.s-ausente{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.card-footer-text{font-size:13px;color:#9b7e6a;margin-top:28px}
.card-thanks{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:#7a4f2e;margin-top:6px}
.print-btn{margin-top:24px;padding:10px 28px;border:1px solid #c4956a;background:transparent;color:#c4956a;border-radius:30px;cursor:pointer;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.print-btn:hover{background:#c4956a;color:#fff}
.admin{max-width:1080px;margin:0 auto;padding:40px 20px 80px}
.admin-top{text-align:center;margin-bottom:44px}
.admin-top .eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#b8956a;margin-bottom:10px}
.admin-top h1{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:400;color:#7a4f2e;margin-bottom:8px}
.admin-top p{color:#9b7e6a;font-size:14px}
.config{background:#fff;border:1px solid #e8d5c0;border-radius:14px;padding:20px 24px;margin-bottom:24px}
.config label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#b8956a;display:block;margin-bottom:8px}
.config input{width:100%;border:1px solid #e8d5c0;border-radius:8px;padding:10px 14px;font-size:14px;font-family:'Jost',sans-serif;outline:none;color:#3a2e26;background:#faf7f2}
.config input:focus{border-color:#c4956a;background:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:28px}
.stat{background:#fff;border:1px solid #e8d5c0;border-radius:12px;padding:16px;text-align:center}
.stat-n{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;line-height:1;color:#7a4f2e}
.stat-l{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#b8956a;margin-top:4px}
.tabs{display:flex;gap:0;margin-bottom:-1px;position:relative;z-index:1}
.tab-btn{padding:10px 24px;border:1px solid #e8d5c0;border-bottom:none;background:#faf7f2;color:#b8956a;cursor:pointer;font-family:'Jost',sans-serif;font-size:13px;border-radius:10px 10px 0 0;transition:all .15s}
.tab-btn.active{background:#fff;color:#7a4f2e;border-color:#e8d5c0;font-weight:500}
.tab-panel{background:#fff;border:1px solid #e8d5c0;border-radius:0 14px 14px 14px;overflow:hidden}
.searchbar{padding:16px 20px;border-bottom:1px solid #f0e6d8;display:flex;gap:10px;flex-wrap:wrap}
.searchbar input,.searchbar select{border:1px solid #e8d5c0;border-radius:8px;padding:9px 14px;font-size:13px;font-family:'Jost',sans-serif;color:#3a2e26;outline:none;background:#faf7f2}
.searchbar input{flex:1;min-width:180px}
.searchbar input:focus,.searchbar select:focus{border-color:#c4956a;background:#fff}
table{width:100%;border-collapse:collapse}
th{background:#7a4f2e;color:#f5ede0;padding:12px 16px;text-align:left;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:400}
td{padding:11px 16px;border-bottom:1px solid #f5ede0;font-size:13px;color:#3a2e26}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdf9f5}
.id-cell{font-family:'Cormorant Garamond',serif;font-size:16px;color:#7a4f2e;font-style:italic}
.qr-mini-btn{padding:5px 14px;border:1px solid #c4956a;border-radius:6px;background:#fff;color:#c4956a;cursor:pointer;font-size:12px;font-family:'Jost',sans-serif;transition:all .15s}
.qr-mini-btn:hover{background:#c4956a;color:#fff}
.qr-grid-wrap{padding:20px}
.qr-search-bar{margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qr-search-bar input{border:1px solid #e8d5c0;border-radius:8px;padding:9px 14px;font-size:13px;flex:1;min-width:200px;outline:none;font-family:'Jost',sans-serif;background:#faf7f2;color:#3a2e26}
.qr-search-bar input:focus{border-color:#c4956a;background:#fff}
.info-note{font-size:12px;color:#b8956a;padding:10px 14px;background:#fdf9f5;border-radius:8px;border-left:3px solid #c4956a;margin-bottom:16px}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.qr-card{background:#fff;border:1px solid #e8d5c0;border-radius:12px;padding:16px;text-align:center}
.qr-card-name{font-family:'Cormorant Garamond',serif;font-size:14px;color:#7a4f2e;margin:10px 0 2px;font-style:italic;line-height:1.2}
.qr-card-info{font-size:11px;color:#b8956a;margin-bottom:10px;letter-spacing:1px}
.dl-btn{width:100%;padding:7px;border:1px solid #c4956a;border-radius:8px;background:#fff;color:#c4956a;cursor:pointer;font-size:12px;font-family:'Jost',sans-serif;transition:all .15s}
.dl-btn:hover{background:#c4956a;color:#fff}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(58,46,38,.55);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:36px 32px;text-align:center;max-width:320px;width:100%;position:relative}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:#7a4f2e;margin-bottom:4px;font-style:italic}
.modal p{font-size:12px;color:#b8956a;margin-bottom:20px;letter-spacing:1px}
#modal-qr-box{margin:0 auto 20px;display:flex;justify-content:center}
.modal-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn-gold{padding:9px 22px;border:1px solid #c4956a;background:#c4956a;color:#fff;border-radius:8px;cursor:pointer;font-size:12px;font-family:'Jost',sans-serif;letter-spacing:1px}
.btn-ghost{padding:9px 22px;border:1px solid #e8d5c0;background:#fff;color:#9b7e6a;border-radius:8px;cursor:pointer;font-size:12px;font-family:'Jost',sans-serif}
.btn-gold:hover{background:#b07d54}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#b8956a;line-height:1}
@media(max-width:600px){.admin{padding:20px 12px 60px}.card{padding:44px 28px 40px}.tabs{flex-wrap:wrap}.tab-btn{border-radius:8px;border-bottom:1px solid #e8d5c0;margin-bottom:4px}}
</style>
</head>
<body>

<div id="app"></div>

<div class="modal-bg" id="qr-modal">
  <div class="modal">
    <button class="close-x" onclick="closeModal()">x</button>
    <h3 id="m-name">Nome</h3>
    <p id="m-info">Mesa - Convidado</p>
    <div id="modal-qr-box"></div>
    <div class="modal-actions">
      <button class="btn-gold" onclick="downloadCurrentQR()">Descarregar PNG</button>
      <button class="btn-ghost" onclick="closeModal()">Fechar</button>
    </div>
  </div>
</div>

<script>
// ==============================================
// CONFIGURACAO
// ==============================================
var BASE_URL = 'https://edgersn.github.io';

// ==============================================
// VARIAVEIS GLOBAIS - ANTES DO ROUTING!
// ==============================================
var activeTab  = 'lista';
var searchStr  = '';
var statusFil  = '';
var qrFilter   = '';
var modalGuest = null;

// ==============================================
// GERADOR DETERMINISTICO DE CONVIDADOS
// ==============================================
function gerarConvidados() {
  var nomesM = ['Joao','Manuel','Antonio','Carlos','Pedro','Paulo','Miguel','Fernando','Ricardo','Eduardo','Luis','Francisco','Helder','Nuno','Bruno','Andre','Daniel','Marcos','Tiago','Rafael','Kelson','Adilson','Ernesto','Celestino','Joaquim','Filipe','Domingos','Faustino','Sebastiao','Augusto','Horacio','Leandro','Osvaldo','Reinaldo','Venancio','Guilherme','Vladmir','Isaias','Edmundo','Helio'];
  var nomesF = ['Maria','Ana','Sofia','Isabel','Catarina','Marta','Sandra','Paula','Carla','Joana','Luisa','Teresa','Beatriz','Ines','Margarida','Filomena','Conceicao','Lurdes','Graca','Helena','Rosa','Amelia','Felicia','Benedita','Albertina','Leopoldina','Deolinda','Esperanca','Fatima','Gertrudes','Susana','Vanessa','Patricia','Claudia','Debora','Elisabete','Fernanda','Gisela','Hortencia','Ivone'];
  var apelidos = ['Silva','Santos','Costa','Ferreira','Oliveira','Pereira','Rodrigues','Almeida','Nascimento','Carvalho','Lopes','Marques','Fernandes','Gomes','Martins','Pinto','Ribeiro','Sousa','Machado','Dias','Andrade','Araujo','Campos','Castro','Correia','Cunha','Figueiredo','Freitas','Henriques','Lima','Matos','Moura','Neves','Nunes','Pires','Ramos','Reis','Rocha','Tavares','Teixeira'];
  var acomp = ['e esposa','e marido','e acompanhante','e familia','e esposo',''];
  var estados = ['Confirmado','Confirmado','Confirmado','Confirmado','Confirmado','Confirmado','Confirmado','Pendente','Pendente','Ausente'];

  // Gerador deterministico simples (s mantem-se dentro de limites seguros)
  var s = 7391;
  function rnd() {
    s = ((s * 1103515245) + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  }

  var lista = [];
  for (var i = 1; i <= 200; i++) {
    var mesa   = Math.ceil(i / 4);
    var masculino = rnd() > 0.44;
    var pool   = masculino ? nomesM : nomesF;
    var nome1  = pool[Math.floor(rnd() * pool.length)];
    var ap1    = apelidos[Math.floor(rnd() * apelidos.length)];
    var ap2    = apelidos[Math.floor(rnd() * apelidos.length)];
    var comp   = acomp[Math.floor(rnd() * acomp.length)];
    var estado = estados[Math.floor(rnd() * estados.length)];
    var nomeCompleto = nome1 + ' ' + ap1;
    if (ap1 !== ap2 && rnd() > 0.5) nomeCompleto += ' ' + ap2;
    if (comp) nomeCompleto += ' ' + comp;
    lista.push({ id: i, name: nomeCompleto, table: mesa, status: estado });
  }
  return lista;
}

var GUESTS = gerarConvidados();

// ==============================================
// ROUTING (DEPOIS das variaveis globais!)
// ==============================================
(function() {
  var params  = new URLSearchParams(window.location.search);
  var gId     = parseInt(params.get('id'));
  if (gId >= 1 && gId <= 200) {
    mostrarCartao(gId);
  } else {
    mostrarAdmin();
  }
})();

// ==============================================
// VISTA CONVIDADO
// ==============================================
function mostrarCartao(id) {
  var g = null;
  for (var i = 0; i < GUESTS.length; i++) { if (GUESTS[i].id === id) { g = GUESTS[i]; break; } }
  if (!g) {
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:80px 20px;font-family:Georgia,serif;color:#9b7e6a;font-size:22px">Convidado nao encontrado.</div>';
    return;
  }
  document.title = g.name + ' - Casamento 2026';
  var sc = 's-' + g.status.toLowerCase();
  document.getElementById('app').innerHTML =
    '<div class="card-wrap"><div class="card">' +
    '<span class="ornament">* * *</span>' +
    '<div class="card-welcome">Bem-vindo!</div>' +
    '<div class="card-sub">Ao Casamento de Amilton e Odmira &middot; 11/09/2026</div>' +
    '<div class="hr"><div class="hr-icon">&#9825;</div></div>' +
    '<div class="lbl">Nome</div>' +
    '<div class="val">' + g.name + '</div>' +
    '<div class="lbl">Convidado N&ordm;</div>' +
    '<div class="val-big">' + pad(g.id) + '</div>' +
    '<div class="lbl">Mesa</div>' +
    '<div class="val-big">' + g.table + '</div>' +
    '<div class="lbl" style="margin-bottom:10px">Estado</div>' +
    '<span class="status-pill ' + sc + '">' + g.status + '</span>' +
    '<div class="hr"><div class="hr-icon">*</div></div>' +
    '<div class="card-footer-text">Obrigado por celebrar connosco.</div>' +
    '<div class="card-thanks">Muito obrigado &hearts;</div>' +
    '<div><button class="print-btn" onclick="window.print()">Imprimir / Guardar</button></div>' +
    '</div></div>';
}

function pad(n) { return n < 10 ? '00'+n : n < 100 ? '0'+n : ''+n; }

// ==============================================
// ADMIN
// ==============================================
function mostrarAdmin() {
  var conf = 0, pend = 0, ause = 0;
  for (var i = 0; i < GUESTS.length; i++) {
    if (GUESTS[i].status === 'Confirmado') conf++;
    else if (GUESTS[i].status === 'Pendente') pend++;
    else ause++;
  }
  document.getElementById('app').innerHTML =
    '<div class="admin">' +
    '<div class="admin-top">' +
    '<div class="eyebrow">* Sistema de Convites *</div>' +
    '<h1>Gestao de Convidados</h1>' +
    '<p>200 convidados &middot; 50 mesas &middot; QR codes com fundo transparente</p>' +
    '</div>' +
    '<div class="config"><label>URL do GitHub Pages (altere apos publicar)</label>' +
    '<input id="url-inp" value="' + BASE_URL + '" oninput="BASE_URL=this.value" placeholder="https://edgersn.github.io"></div>' +
    '<div class="stats">' +
    '<div class="stat"><div class="stat-n">200</div><div class="stat-l">Total</div></div>' +
    '<div class="stat"><div class="stat-n" style="color:#166534">' + conf + '</div><div class="stat-l">Confirmados</div></div>' +
    '<div class="stat"><div class="stat-n" style="color:#92400e">' + pend + '</div><div class="stat-l">Pendentes</div></div>' +
    '<div class="stat"><div class="stat-n" style="color:#991b1b">' + ause + '</div><div class="stat-l">Ausentes</div></div>' +
    '<div class="stat"><div class="stat-n">50</div><div class="stat-l">Mesas</div></div>' +
    '</div>' +
    '<div class="tabs">' +
    '<button class="tab-btn ' + (activeTab==='lista'?'active':'') + '" onclick="mudarTab(\'lista\')">Lista de Convidados</button>' +
    '<button class="tab-btn ' + (activeTab==='qr'?'active':'') + '" onclick="mudarTab(\'qr\')">Gerar QR Codes</button>' +
    '</div>' +
    '<div class="tab-panel" id="tab-body"></div>' +
    '</div>';
  renderizarTab();
}

function mudarTab(t) {
  activeTab = t;
  var btns = document.querySelectorAll('.tab-btn');
  btns[0].className = 'tab-btn' + (t==='lista'?' active':'');
  btns[1].className = 'tab-btn' + (t==='qr'?' active':'');
  renderizarTab();
}

function renderizarTab() {
  var el = document.getElementById('tab-body');
  if (!el) return;
  if (activeTab === 'lista') renderLista(el);
  else renderQR(el);
}

function filtrados() {
  var q = searchStr.toLowerCase();
  var res = [];
  for (var i = 0; i < GUESTS.length; i++) {
    var g = GUESTS[i];
    var okNome   = !q || g.name.toLowerCase().indexOf(q) >= 0 || (''+g.id).indexOf(q) >= 0;
    var okStatus = !statusFil || g.status === statusFil;
    if (okNome && okStatus) res.push(g);
  }
  return res;
}

function renderLista(el) {
  var list = filtrados();
  var rows = '';
  for (var i = 0; i < list.length; i++) {
    var g = list[i];
    var sc = 's-' + g.status.toLowerCase();
    rows += '<tr>' +
      '<td><span class="id-cell">#' + pad(g.id) + '</span></td>' +
      '<td>' + g.name + '</td>' +
      '<td style="font-weight:500">Mesa ' + g.table + '</td>' +
      '<td><span class="status-pill ' + sc + '" style="font-size:10px;padding:4px 12px">' + g.status + '</span></td>' +
      '<td><button class="qr-mini-btn" onclick="abrirModal(' + g.id + ')">QR</button></td>' +
      '</tr>';
  }
  if (!rows) rows = '<tr><td colspan="5" style="text-align:center;padding:32px;color:#b8956a">Nenhum resultado.</td></tr>';

  el.innerHTML =
    '<div class="searchbar">' +
    '<input placeholder="Pesquisar por nome ou numero..." value="' + searchStr + '" oninput="searchStr=this.value;renderizarTab()">' +
    '<select onchange="statusFil=this.value;renderizarTab()" style="cursor:pointer">' +
    '<option value="">Todos os estados</option>' +
    '<option value="Confirmado"' + (statusFil==='Confirmado'?' selected':'') + '>Confirmado</option>' +
    '<option value="Pendente"' + (statusFil==='Pendente'?' selected':'') + '>Pendente</option>' +
    '<option value="Ausente"' + (statusFil==='Ausente'?' selected':'') + '>Ausente</option>' +
    '</select></div>' +
    '<div style="overflow-x:auto"><table>' +
    '<thead><tr><th>N&ordm;</th><th>Nome</th><th>Mesa</th><th>Estado</th><th>QR Code</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>' +
    '<div style="padding:14px 20px;font-size:12px;color:#b8956a;text-align:right">' + list.length + ' convidado(s)</div>';
}

function renderQR(el) {
  el.innerHTML =
    '<div class="qr-grid-wrap">' +
    '<div class="info-note">QR codes com fundo transparente - prontos para colocar no convite. Filtre para encontrar o convidado.</div>' +
    '<div class="qr-search-bar">' +
    '<input placeholder="Filtrar convidados..." value="' + qrFilter + '" oninput="qrFilter=this.value;atualizarGrelha()">' +
    '</div>' +
    '<div class="qr-grid" id="qr-grid"></div>' +
    '</div>';
  atualizarGrelha();
}

function atualizarGrelha() {
  var q = qrFilter.toLowerCase();
  var list = [];
  for (var i = 0; i < GUESTS.length; i++) {
    var g = GUESTS[i];
    if (!q || g.name.toLowerCase().indexOf(q) >= 0 || (''+g.id).indexOf(q) >= 0) {
      list.push(g);
      if (list.length >= 48) break;
    }
  }
  var grid = document.getElementById('qr-grid');
  if (!grid) return;
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var g = list[i];
    var nome = g.name.split(' e ')[0].split(' ').slice(0,2).join(' ');
    html += '<div class="qr-card">' +
      '<div id="qrt-' + g.id + '" style="width:130px;height:130px;margin:0 auto"></div>' +
      '<div class="qr-card-name">' + nome + '</div>' +
      '<div class="qr-card-info">#' + pad(g.id) + ' - Mesa ' + g.table + '</div>' +
      '<button class="dl-btn" onclick="baixarQRPorId(' + g.id + ')">Descarregar PNG</button>' +
      '</div>';
  }
  grid.innerHTML = html;
  setTimeout(function() {
    for (var i = 0; i < list.length; i++) { gerarMiniaturaQR(list[i]); }
  }, 100);
}

function gerarMiniaturaQR(g) {
  var el = document.getElementById('qrt-' + g.id);
  if (!el || el.childNodes.length) return;
  try {
    new QRCode(el, { text: BASE_URL + '?id=' + g.id, width: 130, height: 130, colorDark: '#3a2e26', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
  } catch(e) {}
}

// ==============================================
// MODAL QR
// ==============================================
function abrirModal(id) {
  for (var i = 0; i < GUESTS.length; i++) { if (GUESTS[i].id === id) { modalGuest = GUESTS[i]; break; } }
  document.getElementById('m-name').textContent = modalGuest.name;
  document.getElementById('m-info').textContent = 'Mesa ' + modalGuest.table + ' - Convidado #' + pad(modalGuest.id);
  var box = document.getElementById('modal-qr-box');
  box.innerHTML = '';
  try {
    new QRCode(box, { text: BASE_URL + '?id=' + id, width: 200, height: 200, colorDark: '#3a2e26', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
  } catch(e) {}
  document.getElementById('qr-modal').classList.add('open');
}
function closeModal() { document.getElementById('qr-modal').classList.remove('open'); }

// ==============================================
// DOWNLOAD PNG TRANSPARENTE
// ==============================================
function tornarTransparente(srcCanvas) {
  var c = document.createElement('canvas');
  c.width = srcCanvas.width; c.height = srcCanvas.height;
  var ctx = c.getContext('2d');
  ctx.drawImage(srcCanvas, 0, 0);
  var d = ctx.getImageData(0, 0, c.width, c.height);
  for (var i = 0; i < d.data.length; i += 4) {
    if (d.data[i] > 200 && d.data[i+1] > 200 && d.data[i+2] > 200) d.data[i+3] = 0;
  }
  ctx.putImageData(d, 0, 0);
  return c;
}

function downloadCurrentQR() {
  var canvas = document.querySelector('#modal-qr-box canvas');
  if (!canvas) return;
  var tc = tornarTransparente(canvas);
  var a = document.createElement('a');
  a.download = 'qr-convidado-' + pad(modalGuest.id) + '.png';
  a.href = tc.toDataURL('image/png');
  a.click();
}

function baixarQRPorId(id) {
  var g = null;
  for (var i = 0; i < GUESTS.length; i++) { if (GUESTS[i].id === id) { g = GUESTS[i]; break; } }
  var tmp = document.createElement('div');
  tmp.style.cssText = 'position:absolute;left:-9999px;visibility:hidden';
  document.body.appendChild(tmp);
  try {
    new QRCode(tmp, { text: BASE_URL + '?id=' + id, width: 500, height: 500, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
  } catch(e) {}
  setTimeout(function() {
    var cv = tmp.querySelector('canvas');
    if (cv) {
      var tc = tornarTransparente(cv);
      var a = document.createElement('a');
      a.download = 'qr-' + pad(id) + '-mesa' + g.table + '.png';
      a.href = tc.toDataURL('image/png');
      a.click();
    }
    document.body.removeChild(tmp);
  }, 300);
}

document.getElementById('qr-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
</script>
